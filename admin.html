<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeaTask Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #eef5fa; }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1976a5, #2c8cbb);
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .login-box h1 { margin-bottom: 10px; color: #1a3a5c; }
        .login-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #c8dce8;
            border-radius: 8px;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #1976a5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .login-btn:hover { background: #0f5479; }
        .login-error { color: red; margin-top: 10px; }

        #adminDashboard {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 260px;
            background: #1a3a5c;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar-logo { margin-bottom: 30px; text-align: center; }
        .sidebar-nav { flex: 1; }
        .nav-btn {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
        }
        .nav-btn:hover, .nav-btn.active { background: #1976a5; }
        .logout-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        .main-content { flex: 1; padding: 20px; }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .add-btn, .refresh-btn {
            background: #1976a5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
        .refresh-btn { background: #27ae60; }
        .products-table-container {
            background: white;
            border-radius: 16px;
            padding: 20px;
            overflow-x: auto;
        }
        .products-table {
            width: 100%;
            border-collapse: collapse;
        }
        .products-table th, .products-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0eef5;
        }
        .products-table th { background: #f5f8fa; }
        .edit-btn {
            background: #1976a5;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 5px;
        }
        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 550px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }
        .close-modal {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 28px;
            cursor: pointer;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: #1a3a5c;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #c8dce8;
            border-radius: 8px;
            font-size: 14px;
        }
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        #adminToast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1976a5;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            z-index: 10000;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
        }
        .product-img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 8px;
            background: #f0f4f8;
        }
        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: #1976a5;
        }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-container">
        <div class="login-box">
            <h1>🌊 SeaTask Admin</h1>
            <p>Login to manage your marketplace</p>
            <input type="text" id="loginUsername" placeholder="Username" class="login-input">
            <input type="password" id="loginPassword" placeholder="Password" class="login-input">
            <button id="loginBtn" class="login-btn">Login</button>
            <div id="loginError" class="login-error"></div>
        </div>
    </div>

    <div id="adminDashboard" style="display:none;">
        <div class="sidebar">
            <div class="sidebar-logo"><h2>🌊 SeaTask</h2><p>Admin Panel</p></div>
            <nav class="sidebar-nav">
                <button class="nav-btn active" data-tab="products">📦 Products</button>
                <button class="nav-btn" data-tab="categories">🏷️ Categories</button>
            </nav>
            <button id="logoutBtn" class="logout-btn">🚪 Logout</button>
        </div>
        <div class="main-content">
            <header class="admin-header">
                <h1 id="pageTitle">Products Management</h1>
                <div>
                    <button id="refreshBtn" class="refresh-btn">🔄 Refresh</button>
                    <button id="addNewBtn" class="add-btn">+ Add New Product</button>
                </div>
            </header>
            <div id="productsTab" class="tab-content">
                <div class="products-table-container">
                    <table class="products-table">
                        <thead>
                            <tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Actions</th>
                        </thead>
                        <tbody id="productsList">
                            <tr><td colspan="5" style="text-align:center;">Loading products...<br>Please wait...</td</tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div id="categoriesTab" class="tab-content" style="display:none;">
                <div class="products-table-container">
                    <table class="products-table">
                        <thead>
                            <tr><th>Icon</th><th>Name</th><th>Actions</th>
                        </thead>
                        <tbody id="categoriesList"></tbody>
                    </table>
                </div>
                <button id="addCategoryBtn" class="add-btn" style="margin-top:20px;">+ Add Category</button>
            </div>
        </div>
    </div>
    <div id="adminToast"></div>

    <script>
        const SUPABASE_URL = 'https://fladlejtkgjzpehvzkub.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsYWRsZWp0a2dqenBlaHZ6a3ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwODEwMTcsImV4cCI6MjA5MzY1NzAxN30.uzMR3lWl0GrKKIcpWZRDZ9ac1y_gdjOocAUweSSZMgI';
        
        const ADMIN_USERNAME = 'admin';
        const ADMIN_PASSWORD = 'Seatask2025';
        
        const defaultImages = {
            'Shirt': 'https://img.freepik.com/premium-photo/blue-cotton-tshirt-with-luxury-design-tshirt-mockup_677428-1057.jpg',
            'Hat': 'https://tse1.mm.bing.net/th/id/OIP.ti9ujzBZ9gwzAkfr34i6mgAAAA',
            'Accessories': 'https://images.pexels.com/photos/380774/pexels-photo-380774.jpeg',
            'Electronics': 'https://images.pexels.com/photos/12789436/pexels-photo-12789436.jpeg',
            'Badminton': 'https://cdn.store-assets.com/s/964873/i/49661033.jpg'
        };
        
        let categories = [
            { icon: '👕', name: 'Shirt', id: 1 },
            { icon: '🧢', name: 'Hat', id: 2 },
            { icon: '🎒', name: 'Accessories', id: 3 },
            { icon: '🔊', name: 'Electronics', id: 4 },
            { icon: '🏸', name: 'Badminton', id: 5 }
        ];

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('adminToast');
            toast.style.background = type === 'error' ? '#dc2626' : '#1976a5';
            toast.innerText = message;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }

        function getValidImageUrl(product) {
            if (product.image_url && product.image_url.startsWith('http') && !product.image_url.includes('placeholder')) {
                return product.image_url;
            }
            return defaultImages[product.category] || 'https://picsum.photos/id/1/50/50';
        }

        function checkAuth() {
            if (localStorage.getItem('adminLoggedIn') === 'true') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'flex';
                loadProducts();
                loadCategories();
            } else {
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('adminDashboard').style.display = 'none';
            }
        }

        document.getElementById('loginBtn')?.addEventListener('click', () => {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                localStorage.setItem('adminLoggedIn', 'true');
                checkAuth();
                document.getElementById('loginError').innerText = '';
            } else {
                document.getElementById('loginError').innerText = 'Invalid username or password';
            }
        });

        document.getElementById('logoutBtn')?.addEventListener('click', () => {
            localStorage.removeItem('adminLoggedIn');
            checkAuth();
        });

        document.getElementById('refreshBtn')?.addEventListener('click', () => {
            showToast('🔄 Refreshing products...', 'success');
            loadProducts();
        });

        async function loadProducts() {
            const tbody = document.getElementById('productsList');
            tbody.innerHTML = '<tr><td colspan="5" class="loading-spinner">Loading products from Supabase...</td></tr>';
            
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*&order=id.asc`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                
                const products = await response.json();
                console.log('Products loaded:', products.length);
                
                if (products && products.length > 0) {
                    tbody.innerHTML = products.map(p => {
                        const imageUrl = getValidImageUrl(p);
                        return `
                        <tr data-id="${p.id}">
                            <td><img src="${imageUrl}" width="50" height="50" class="product-img" onerror="this.src='https://picsum.photos/id/1/50/50'"></td>
                            <td><strong>${escapeHtml(p.name)}</strong></td>
                            <td>${escapeHtml(p.category || '-')}</td>
                            <td>RM ${Number(p.price).toFixed(2)}</td>
                            <td>
                                <button class="edit-btn" onclick='editProduct(${JSON.stringify(p)})'>✏️ Edit</button>
                                <button class="delete-btn" onclick="deleteProduct(${p.id})">🗑 Delete</button>
                            </td>
                        </tr>
                    `}).join('');
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">📦 No products found. Click "Add New Product" to create one.</td></tr>';
                }
            } catch (error) {
                console.error('Error loading products:', error);
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:red;">❌ Error: ${error.message}</td></tr>`;
                showToast('Error loading products: ' + error.message, 'error');
            }
        }

        window.deleteProduct = async (id) => {
            if (!confirm('⚠️ Are you sure you want to delete this product? This action cannot be undone.')) return;
            try {
                await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}`, {
                    method: 'DELETE',
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                showToast('✅ Product deleted successfully!', 'success');
                loadProducts();
            } catch (error) {
                showToast('❌ Error deleting product', 'error');
            }
        };

        // FULL EDIT PRODUCT FUNCTION - Opens modal with all fields
        window.editProduct = (product) => {
            // Create modal HTML with all product fields pre-filled
            const modalHtml = `
                <div id="editModal" class="modal-overlay">
                    <div class="modal-content">
                        <span class="close-modal" onclick="closeEditModal()">&times;</span>
                        <h2>✏️ Edit Product: ${escapeHtml(product.name)}</h2>
                        <form id="editProductForm">
                            <div class="form-group">
                                <label>Product Name:</label>
                                <input type="text" id="editName" value="${escapeHtml(product.name)}" required>
                            </div>
                            <div class="form-group">
                                <label>Category:</label>
                                <select id="editCategory">
                                    <option value="Shirt" ${product.category === 'Shirt' ? 'selected' : ''}>👕 Shirt</option>
                                    <option value="Hat" ${product.category === 'Hat' ? 'selected' : ''}>🧢 Hat</option>
                                    <option value="Accessories" ${product.category === 'Accessories' ? 'selected' : ''}>🎒 Accessories</option>
                                    <option value="Electronics" ${product.category === 'Electronics' ? 'selected' : ''}>🔊 Electronics</option>
                                    <option value="Badminton" ${product.category === 'Badminton' ? 'selected' : ''}>🏸 Badminton</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Price (RM):</label>
                                <input type="number" id="editPrice" step="0.01" value="${product.price}" required>
                            </div>
                            <div class="form-group">
                                <label>Image URL:</label>
                                <input type="text" id="editImageUrl" value="${product.image_url || ''}" placeholder="https://...">
                                <small>Leave empty to use default category image</small>
                            </div>
                            <div class="form-group">
                                <label>Rating (1-5):</label>
                                <input type="number" id="editRating" step="0.1" min="0" max="5" value="${product.rating || 4.5}">
                            </div>
                            <div class="form-group">
                                <label>Review Count:</label>
                                <input type="number" id="editReviewCount" step="1" min="0" value="${product.review_count || 0}">
                            </div>
                            <div class="form-group">
                                <label>Description:</label>
                                <textarea id="editDescription" rows="4">${escapeHtml(product.description || '')}</textarea>
                            </div>
                            <button type="submit" class="login-btn" style="margin-top: 10px;">💾 Save Changes</button>
                        </form>
                    </div>
                </div>
            `;
            
            closeEditModal();
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            
            document.getElementById('editProductForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const updatedProduct = {
                    name: document.getElementById('editName').value,
                    category: document.getElementById('editCategory').value,
                    price: parseFloat(document.getElementById('editPrice').value),
                    image_url: document.getElementById('editImageUrl').value || defaultImages[document.getElementById('editCategory').value] || '',
                    rating: parseFloat(document.getElementById('editRating').value),
                    review_count: parseInt(document.getElementById('editReviewCount').value),
                    description: document.getElementById('editDescription').value
                };
                
                try {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${product.id}`, {
                        method: 'PATCH',
                        headers: { 
                            'apikey': SUPABASE_ANON_KEY, 
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 
                            'Content-Type': 'application/json' 
                        },
                        body: JSON.stringify(updatedProduct)
                    });
                    
                    if (response.ok) {
                        showToast('✅ Product updated successfully!', 'success');
                        closeEditModal();
                        loadProducts();
                    } else {
                        const error = await response.text();
                        showToast('❌ Error: ' + error, 'error');
                    }
                } catch (error) {
                    showToast('❌ Error updating product: ' + error.message, 'error');
                }
            });
        };

        // Add New Product Modal
        document.getElementById('addNewBtn')?.addEventListener('click', () => {
            const modalHtml = `
                <div id="addModal" class="modal-overlay">
                    <div class="modal-content">
                        <span class="close-modal" onclick="closeAddModal()">&times;</span>
                        <h2>➕ Add New Product</h2>
                        <form id="addProductForm">
                            <div class="form-group">
                                <label>Product Name:</label>
                                <input type="text" id="addName" required placeholder="e.g., Premium Cotton T-Shirt">
                            </div>
                            <div class="form-group">
                                <label>Category:</label>
                                <select id="addCategory" required>
                                    <option value="">Select Category</option>
                                    <option value="Shirt">👕 Shirt</option>
                                    <option value="Hat">🧢 Hat</option>
                                    <option value="Accessories">🎒 Accessories</option>
                                    <option value="Electronics">🔊 Electronics</option>
                                    <option value="Badminton">🏸 Badminton</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Price (RM):</label>
                                <input type="number" id="addPrice" step="0.01" required placeholder="0.00">
                            </div>
                            <div class="form-group">
                                <label>Image URL:</label>
                                <input type="text" id="addImageUrl" placeholder="https://...">
                                <small>Leave empty for default category image</small>
                            </div>
                            <div class="form-group">
                                <label>Rating (1-5):</label>
                                <input type="number" id="addRating" step="0.1" min="0" max="5" value="4.5">
                            </div>
                            <div class="form-group">
                                <label>Description:</label>
                                <textarea id="addDescription" rows="3" placeholder="Product description..."></textarea>
                            </div>
                            <button type="submit" class="login-btn" style="margin-top: 10px;">➕ Create Product</button>
                        </form>
                    </div>
                </div>
            `;
            
            closeAddModal();
            document.body.insertAdjacentHTML('beforeend', modalHtml);
            
            document.getElementById('addProductForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const category = document.getElementById('addCategory').value;
                let imageUrl = document.getElementById('addImageUrl').value;
                
                if (!imageUrl) {
                    imageUrl = defaultImages[category] || 'https://picsum.photos/id/1/400/400';
                }
                
                const newProduct = {
                    name: document.getElementById('addName').value,
                    category: category,
                    price: parseFloat(document.getElementById('addPrice').value),
                    image_url: imageUrl,
                    rating: parseFloat(document.getElementById('addRating').value),
                    description: document.getElementById('addDescription').value,
                    review_count: 0
                };
                
                try {
                    const response = await fetch(`${SUPABASE_URL}/rest/v1/products`, {
                        method: 'POST',
                        headers: {
                            'apikey': SUPABASE_ANON_KEY,
                            'Authorization': `Bearer ${SUPABASE_ANON_KEY}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(newProduct)
                    });
                    
                    if (response.ok) {
                        showToast('✅ Product created successfully!', 'success');
                        closeAddModal();
                        loadProducts();
                    } else {
                        const error = await response.text();
                        showToast('❌ Error: ' + error, 'error');
                    }
                } catch (error) {
                    showToast('❌ Error: ' + error.message, 'error');
                }
            });
        });

        // Category Management
        function loadCategories() {
            document.getElementById('categoriesList').innerHTML = categories.map(c => `
                <tr>
                    <td style="font-size:24px;">${c.icon}</td>
                    <td><strong>${escapeHtml(c.name)}</strong></td>
                    <td>
                        <button class="edit-btn" onclick="editCategory(${c.id})">✏️ Edit</button>
                        <button class="delete-btn" onclick="deleteCategory(${c.id})">🗑 Delete</button>
                    </td>
                </tr>
            `).join('');
        }

        window.editCategory = (id) => {
            const category = categories.find(c => c.id === id);
            if (!category) return;
            const newName = prompt('Edit category name:', category.name);
            if (newName && newName.trim()) {
                category.name = newName.trim();
                loadCategories();
                showToast(`✅ Category updated to "${newName}"`, 'success');
            }
        };

        window.deleteCategory = (id) => {
            const category = categories.find(c => c.id === id);
            if (category && confirm(`Delete category "${category.name}"?`)) {
                categories = categories.filter(c => c.id !== id);
                loadCategories();
                showToast(`✅ Category "${category.name}" deleted`, 'success');
            }
        };

        document.getElementById('addCategoryBtn')?.addEventListener('click', () => {
            const newName = prompt('Enter new category name:');
            if (newName && newName.trim()) {
                const newIcon = prompt('Enter icon (emoji):', '📦');
                const newId = Math.max(...categories.map(c => c.id), 0) + 1;
                categories.push({ id: newId, name: newName.trim(), icon: newIcon || '📦' });
                loadCategories();
                showToast(`✅ Category "${newName}" added!`, 'success');
            }
        });

        // Modal close functions
        window.closeEditModal = () => {
            const modal = document.getElementById('editModal');
            if (modal) modal.remove();
        };
        window.closeAddModal = () => {
            const modal = document.getElementById('addModal');
            if (modal) modal.remove();
        };

        // Tab Navigation
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.dataset.tab;
                document.getElementById('productsTab').style.display = tab === 'products' ? 'block' : 'none';
                document.getElementById('categoriesTab').style.display = tab === 'categories' ? 'block' : 'none';
                document.getElementById('pageTitle').innerText = tab === 'products' ? 'Products Management' : 'Categories Management';
                if (tab === 'products') {
                    loadProducts();
                }
            });
        });

        // Initialize
        checkAuth();
    </script>
</body>
</html>
