<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SeaTask Admin Panel</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #eef5fa; }

        .login-container {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #1976a5, #2c8cbb);
        }
        .login-box {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .login-box h1 { margin-bottom: 10px; color: #1a3a5c; }
        .login-input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #c8dce8;
            border-radius: 8px;
        }
        .login-btn {
            width: 100%;
            padding: 12px;
            background: #1976a5;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        .login-btn:hover { background: #0f5479; }
        .login-error { color: red; margin-top: 10px; }

        #adminDashboard {
            display: flex;
            min-height: 100vh;
        }
        .sidebar {
            width: 260px;
            background: #1a3a5c;
            color: white;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }
        .sidebar-logo { margin-bottom: 30px; text-align: center; }
        .sidebar-nav { flex: 1; }
        .nav-btn {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            background: rgba(255,255,255,0.1);
            border: none;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            text-align: left;
            font-size: 14px;
        }
        .nav-btn:hover, .nav-btn.active { background: #1976a5; }
        .logout-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 20px;
        }
        .main-content { flex: 1; padding: 20px; }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .add-btn {
            background: #1976a5;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
        }
        .products-table-container {
            background: white;
            border-radius: 16px;
            padding: 20px;
            overflow-x: auto;
        }
        .products-table {
            width: 100%;
            border-collapse: collapse;
        }
        .products-table th, .products-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0eef5;
        }
        .products-table th { background: #f5f8fa; }
        .edit-btn {
            background: #1976a5;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 5px;
        }
        .delete-btn {
            background: #dc2626;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 20px;
            max-width: 500px;
            width: 90%;
            max-height: 85vh;
            overflow-y: auto;
            position: relative;
        }
        .close-modal {
            position: absolute;
            right: 20px;
            top: 15px;
            font-size: 28px;
            cursor: pointer;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
        }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #c8dce8;
            border-radius: 8px;
        }
        #adminToast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1976a5;
            color: white;
            padding: 12px 24px;
            border-radius: 40px;
            z-index: 10000;
            opacity: 0;
            transition: 0.3s;
        }
    </style>
</head>
<body>
    <div id="loginScreen" class="login-container">
        <div class="login-box">
            <h1>🌊 SeaTask Admin</h1>
            <p>Login to manage your marketplace</p>
            <input type="text" id="loginUsername" placeholder="Username" class="login-input">
            <input type="password" id="loginPassword" placeholder="Password" class="login-input">
            <button id="loginBtn" class="login-btn">Login</button>
            <div id="loginError" class="login-error"></div>
        </div>
    </div>

    <div id="adminDashboard" style="display:none;">
        <div class="sidebar">
            <div class="sidebar-logo"><h2>🌊 SeaTask</h2><p>Admin Panel</p></div>
            <nav class="sidebar-nav">
                <button class="nav-btn active" data-tab="products">📦 Products</button>
                <button class="nav-btn" data-tab="categories">🏷️ Categories</button>
            </nav>
            <button id="logoutBtn" class="logout-btn">🚪 Logout</button>
        </div>
        <div class="main-content">
            <header class="admin-header">
                <h1 id="pageTitle">Products Management</h1>
                <button id="addNewBtn" class="add-btn">+ Add New Product</button>
            </header>
            <div id="productsTab" class="tab-content">
                <div class="products-table-container">
                    <table class="products-table">
                        <thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Actions</th></tr></thead>
                        <tbody id="productsList"><tr><td colspan="5" style="text-align:center;">Loading products...</td></tr></tbody>
                    </table>
                </div>
            </div>
            <div id="categoriesTab" class="tab-content" style="display:none;">
                <div class="products-table-container">
                    <table class="products-table">
                        <thead><tr><th>Icon</th><th>Name</th><th>Actions</th></tr></thead>
                        <tbody id="categoriesList"><tr><td colspan="3" style="text-align:center;">Loading categories...</td></tr></tbody>
                    </table>
                </div>
                <button id="addCategoryBtn" class="add-btn" style="margin-top:20px;">+ Add Category</button>
            </div>
        </div>
    </div>
    <div id="adminToast"></div>

    <script>
        const SUPABASE_URL = 'https://fladlejtkgjzpehvzkub.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsYWRsZWp0a2dqenBlaHZ6a3ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwODEwMTcsImV4cCI6MjA5MzY1NzAxN30.uzMR3lWl0GrKKIcpWZRDZ9ac1y_gdjOocAUweSSZMgI';
        const ADMIN_USERNAME = 'admin';
        const ADMIN_PASSWORD = 'Seatask2025';

        let categories = [
            { icon: '👕', name: 'Shirt', id: 1 },
            { icon: '🧢', name: 'Hat', id: 2 },
            { icon: '🎒', name: 'Accessories', id: 3 },
            { icon: '🔊', name: 'Electronics', id: 4 },
            { icon: '🏸', name: 'Badminton', id: 5 }
        ];

        function checkAuth() {
            if (localStorage.getItem('adminLoggedIn') === 'true') {
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('adminDashboard').style.display = 'flex';
                loadProducts();
                loadCategories();
            } else {
                document.getElementById('loginScreen').style.display = 'flex';
                document.getElementById('adminDashboard').style.display = 'none';
            }
        }

        document.getElementById('loginBtn')?.addEventListener('click', () => {
            const username = document.getElementById('loginUsername').value;
            const password = document.getElementById('loginPassword').value;
            if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
                localStorage.setItem('adminLoggedIn', 'true');
                checkAuth();
                document.getElementById('loginError').innerText = '';
            } else {
                document.getElementById('loginError').innerText = 'Invalid username or password';
            }
        });

        document.getElementById('logoutBtn')?.addEventListener('click', () => {
            localStorage.removeItem('adminLoggedIn');
            checkAuth();
        });

        async function loadProducts() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*&order=id.asc`, {
                    headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
                });
                const products = await response.json();
                if (products && products.length > 0) {
                    document.getElementById('productsList').innerHTML = products.map(p => `
                        <tr>
                            <td><img src="${p.image_url || 'https://via.placeholder.com/50'}" width="50" height="50" style="object-fit:cover; border-radius:8px;" onerror="this.src='https://via.placeholder.com/50'"></td>
                            <td><strong>${escapeHtml(p.name)}</strong></td>
                            <td>${escapeHtml(p.category || '-')}</td>
                            <td>RM ${Number(p.price).toFixed(2)}</td>
                            <td><button class="edit-btn" onclick="editProduct(${p.id})">✏️ Edit</button><button class="delete-btn" onclick="deleteProduct(${p.id})">🗑 Delete</button></td>
                        </tr>
                    `).join('');
                } else {
                    document.getElementById('productsList').innerHTML = '<tr><td colspan="5" style="text-align:center;">No products found. Click "Add New Product" to create one.</td></tr>';
                }
            } catch (error) {
                document.getElementById('productsList').innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Error loading products. Check console.</td></tr>';
                console.error(error);
            }
        }

        window.deleteProduct = async (id) => {
            if (confirm('Delete this product?')) {
                await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}`, { method: 'DELETE', headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
                showToast('Product deleted!', 'success');
                loadProducts();
            }
        };

        window.editProduct = async (id) => {
            const res = await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}&select=*`, { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } });
            const products = await res.json();
            const product = products[0];
            if (!product) return;
            const newName = prompt('New product name:', product.name);
            if (newName) {
                await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${id}`, {
                    method: 'PATCH', headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: newName })
                });
                showToast('Product updated!', 'success');
                loadProducts();
            }
        };

        document.getElementById('addNewBtn')?.addEventListener('click', () => {
            const name = prompt('Product name:');
            if (!name) return;
            const category = prompt('Category (Shirt, Hat, Accessories, Electronics, Badminton):');
            const price = parseFloat(prompt('Price (RM):'));
            const image_url = prompt('Image URL:', 'https://via.placeholder.com/400');
            fetch(`${SUPABASE_URL}/rest/v1/products`, {
                method: 'POST', headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, category, price, image_url, rating: 4.5, review_count: 0 })
            }).then(() => { showToast('Product added!', 'success'); loadProducts(); });
        });

        function loadCategories() {
            document.getElementById('categoriesList').innerHTML = categories.map(c => `
                <tr><td style="font-size:24px;">${c.icon}</td><td><strong>${escapeHtml(c.name)}</strong></td>
                <td><button class="edit-btn" onclick="editCategory(${c.id})">✏️ Edit</button><button class="delete-btn" onclick="deleteCategory(${c.id})">🗑 Delete</button></td></tr>
            `).join('');
        }

        window.editCategory = (id) => {
            const category = categories.find(c => c.id === id);
            if (!category) return;
            const newName = prompt('Edit category name:', category.name);
            if (newName && newName.trim()) {
                category.name = newName.trim();
                loadCategories();
                showToast(`Category updated to "${newName}"`, 'success');
            }
        };

        window.deleteCategory = (id) => {
            const category = categories.find(c => c.id === id);
            if (category && confirm(`Delete category "${category.name}"?`)) {
                categories = categories.filter(c => c.id !== id);
                loadCategories();
                showToast(`Category "${category.name}" deleted`, 'success');
            }
        };

        document.getElementById('addCategoryBtn')?.addEventListener('click', () => {
            const newName = prompt('Enter new category name:');
            if (newName && newName.trim()) {
                const newIcon = prompt('Enter icon (emoji):', '📦');
                const newId = Math.max(...categories.map(c => c.id), 0) + 1;
                categories.push({ id: newId, name: newName.trim(), icon: newIcon || '📦' });
                loadCategories();
                showToast(`Category "${newName}" added!`, 'success');
            }
        });

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(message, type) {
            const toast = document.getElementById('adminToast');
            toast.style.background = type === 'error' ? '#dc2626' : '#1976a5';
            toast.innerText = message;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 3000);
        }

        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                const tab = btn.dataset.tab;
                document.getElementById('productsTab').style.display = tab === 'products' ? 'block' : 'none';
                document.getElementById('categoriesTab').style.display = tab === 'categories' ? 'block' : 'none';
                document.getElementById('pageTitle').innerText = tab === 'products' ? 'Products Management' : 'Categories Management';
                if (tab === 'products') {
                    document.getElementById('addNewBtn').style.display = 'block';
                } else {
                    document.getElementById('addNewBtn').style.display = 'none';
                }
            });
        });

        checkAuth();
    </script>
</body>
</html>
