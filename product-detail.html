max-width: 1200px;
margin: 30px auto;
padding: 0 20px;
}
.product-detail-main {

gap: 40px;
flex-wrap: wrap;
background: white;
border-radius: 20px;
padding: 30px;

}
.product-detail-gallery {
flex: 1;
min-width: 300px;
position: relative;
}
.product-detail-gallery img {
width: 100%;
max-width: 400px;
border-radius: 16px;
background: #f5f8fa;
padding: 20px;
display: block;
margin: 0 auto;
}
.product-detail-info {
flex: 1.5;
min-width: 300px;
}
.product-detail-title {
font-size: 24px;
font-weight: 600;
color: #1a3a5c;
margin-bottom: 8px;
}
.product-detail-brand {
color: #7a8e9c;
font-size: 14px;
margin-bottom: 10px;
}
.product-detail-rating {
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 15px;
}
.rating-stars {
color: #f5b042;
font-size: 16px;
}
.rating-count {
color: #7a8e9c;
font-size: 14px;
}
.product-detail-price {
background: #eef5fa;
padding: 15px;
border-radius: 12px;
margin: 15px 0;
}
.current-price {
font-size: 32px;
font-weight: bold;
color: #1976a5;
}
.original-price {
font-size: 18px;
color: #999;
text-decoration: line-through;
margin-left: 10px;
}
.discount {
background: #ff6b6b;
color: white;
padding: 4px 8px;
border-radius: 20px;
font-size: 12px;
margin-left: 10px;
}
.product-variations {
margin: 20px 0;
}
.variation-label {
font-weight: 600;
margin-bottom: 8px;
color: #1a3a5c;
}
.variation-options {
display: flex;
gap: 10px;
flex-wrap: wrap;
}
.variation-btn {
background: white;
border: 1px solid #c8dce8;
padding: 8px 16px;
border-radius: 30px;
cursor: pointer;
transition: 0.2s;
}
.variation-btn:hover, .variation-btn.active {
background: #1976a5;
color: white;
border-color: #1976a5;
}
.quantity-selector {
display: flex;
align-items: center;
gap: 15px;
margin: 20px 0;
}
.quantity-btn {
background: #e0eef5;
border: none;
width: 36px;
height: 36px;
border-radius: 50%;
font-size: 20px;
cursor: pointer;
}
.quantity-value {
font-size: 18px;
font-weight: 600;
min-width: 40px;
text-align: center;
}
.add-to-cart-detail {
background: #1976a5;
color: white;
border: none;
padding: 14px 28px;
border-radius: 40px;
font-size: 16px;
font-weight: 600;
cursor: pointer;
width: 100%;
margin: 10px 0;
}
.add-to-cart-detail:hover {
background: #0f5479;
}
.seller-info {
background: #f5f8fa;
padding: 15px;
border-radius: 12px;
margin: 20px 0;
}
.seller-name {
font-weight: 600;
color: #1976a5;
}
.delivery-info {
margin: 20px 0;
padding: 15px;
border: 1px solid #e0eef5;
border-radius: 12px;
}
.delivery-row {
display: flex;
justify-content: space-between;
margin-bottom: 10px;
}
.warranty-info {
background: #e8f4fd;
padding: 12px;
border-radius: 12px;
margin: 15px 0;
}
.reviews-section {
margin-top: 40px;
background: white;
border-radius: 20px;
padding: 30px;
}
.review-card {
border-bottom: 1px solid #e0eef5;
padding: 15px 0;
}
.reviewer-name {
font-weight: 600;
}
.review-rating {
color: #f5b042;
font-size: 13px;
}
.review-date {
color: #999;
font-size: 12px;
}
.review-text {
margin-top: 8px;
color: #4a627a;
}
.back-button {
display: inline-block;
margin-bottom: 20px;
color: #1976a5;
text-decoration: none;
}
.back-button:hover {
text-decoration: underline;
}
.recommendations-section {
margin-top: 40px;
background: white;
border-radius: 20px;
padding: 30px;
}
.recommendations-title {
font-size: 20px;
font-weight: 600;
color: #0a4b6e;
margin-bottom: 20px;
border-left: 5px solid #1976a5;
padding-left: 15px;
}
.recommendations-grid {
display: grid;
grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
gap: 20px;
}
.rec-product-card {
background: #f5f8fa;
border-radius: 12px;
overflow: hidden;
cursor: pointer;
transition: transform 0.2s, box-shadow 0.2s;
text-decoration: none;
color: inherit;
display: block;
}
.rec-product-card:hover {
transform: translateY(-3px);
box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}
.rec-product-img {
width: 100%;
height: 150px;
object-fit: contain;
background: white;
padding: 15px;
}
.rec-product-info {
padding: 12px;
}
.rec-product-name {
font-size: 14px;
font-weight: 600;
margin-bottom: 5px;
white-space: nowrap;
overflow: hidden;
text-overflow: ellipsis;
}
.rec-product-price {
color: #1976a5;
font-weight: bold;
font-size: 16px;
}
.rec-product-rating {
color: #f5b042;
font-size: 12px;
margin-top: 5px;
}

/* Angle Dots Styles */
.angle-dots-container { 
    margin-top: 15px; 
    text-align: center; 
}
.angle-dots { 
    display: flex; 
    justify-content: center; 
    gap: 10px; 
    flex-wrap: wrap; 
}
.angle-dot { 
    width: 10px; 
    height: 10px; 
    border-radius: 50%; 
    background: #ccc; 
    border: none; 
    cursor: pointer; 
    transition: all 0.2s ease; 
    padding: 0; 
    margin: 0; 
}
.angle-dot:hover { 
    background: #888; 
    transform: scale(1.2); 
}
.angle-dot.active { 
    background: #1a1a1a; 
    transform: scale(1.1); 
}

/* Color Selector Styles */
.color-selector {
    margin: 15px 0;
    padding: 10px;
    background: #f5f8fa;
    border-radius: 12px;
}
.color-label {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 10px;
    color: #1a3a5c;
}
.color-options {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}
.color-option {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 2px solid white;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
}
.color-option:hover {
    transform: scale(1.1);
}
.color-option.active {
    border-color: #1976a5;
    transform: scale(1.1);
    box-shadow: 0 0 0 2px #1976a5;
}
.color-option.blue { background: #3b82f6; }
.color-option.black { background: #1a1a1a; }
.color-option.white { background: #e5e7eb; border-color: #999; }
.color-option.green { background: #22c55e; }
.color-option.red { background: #ef4444; }
.color-option.navy { background: #1e3a5f; }
.color-option.gray { background: #6b7280; }
.color-option.pink { background: #ec4899; }

.modal {
display: none;
position: fixed;
z-index: 1000;
left: 0;
top: 0;
width: 100%;
height: 100%;
background: rgba(0,0,0,0.5);
justify-content: center;
align-items: center;
}
.modal-content {
background: white;
padding: 25px;
border-radius: 20px;
width: 90%;
max-width: 500px;
max-height: 80vh;
overflow-y: auto;
position: relative;
}
.close, .close-checkout {
position: absolute;
right: 20px;
top: 15px;
font-size: 28px;
cursor: pointer;
}
.cart-summary {
margin-top: 20px;
padding-top: 15px;
border-top: 2px solid #e0eef5;
}
.cart-total {
text-align: right;
font-size: 18px;
margin-bottom: 15px;
}
.cart-actions {
display: flex;
gap: 12px;
}
.btn-primary, .btn-secondary, .btn-submit {
flex: 1;
padding: 12px;
border: none;
border-radius: 30px;
cursor: pointer;
font-weight: 600;
}
.btn-primary {
background: #1976a5;
color: white;
}
.btn-secondary {
background: #e0eef5;
color: #1a3a5c;
}
.btn-submit {
background: #1976a5;
color: white;
width: 100%;
}
.form-group {
margin-bottom: 15px;
}
.form-group input, .form-group select {
width: 100%;
padding: 12px;
border: 1px solid #c8dce8;
border-radius: 12px;
font-size: 14px;
}
.toast {
position: fixed;
bottom: 30px;
left: 50%;
transform: translateX(-50%);
background: #1976a5;
color: white;
padding: 12px 24px;
border-radius: 40px;
font-size: 14px;
z-index: 1100;
opacity: 0;
visibility: hidden;
transition: 0.3s;
}
footer {
background: #d4e6f1;
margin-top: 50px;
padding: 40px 20px 20px;

.footer-content {
max-width: 1200px;
margin: 0 auto;
text-align: center;

.footer-section h4 {
margin-bottom: 10px;
color: #0a4b6e;
font-size: 18px;
}
.footer-section p {
color: #1a3a5c;
font-size: 14px;
}
.copyright {
text-align: center;
margin-top: 25px;
padding-top: 15px;
border-top: 1px solid #b8cbd8;
font-size: 12px;
color: #4a627a;
}
@media (max-width: 768px) {
.product-detail-main { flex-direction: column; padding: 20px; }
.recommendations-grid { grid-template-columns: repeat(2, 1fr); }
.product-detail-gallery img { max-width: 100%; }
}
</style>

// Default images by category
const defaultImages = {

};

let currentProductId = null;

// Load product from Supabase
async function loadProductFromSupabase() {
    const urlParams = new URLSearchParams(window.location.search);
    const productId = parseInt(urlParams.get('id'));
    currentProductId = productId;
    
    if (isNaN(productId)) {
        document.getElementById('detailContent').innerHTML = '<p>Invalid product ID.</p>';
        return;
    }
    
    try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${productId}&select=*`, {
            headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            }
        });
        
        const products = await response.json();
        const product = products[0];
        
        if (!product) {
            document.getElementById('detailContent').innerHTML = `<div style="text-align:center; padding:40px;"><h2>Product not found</h2><a href="index.html">← Back to Marketplace</a></div>`;
            return;
        }
        
        await displayProductDetail(product);
        
    } catch (error) {
        console.error('Error loading product:', error);
        document.getElementById('detailContent').innerHTML = `<div style="text-align:center; padding:40px;"><h2>Error loading product</h2><p>${error.message}</p></div>`;
    }
}

async function displayProductDetail(product) {
    const imageUrl = product.image_url && product.image_url.startsWith('http') ? product.image_url : defaultImages[product.category] || 'https://picsum.photos/id/1/400/400';
    
    // Get colors for this product
    const colors = productColorImages[product.id] ? Object.keys(productColorImages[product.id]) : [];
    const hasAngles = productAngles[product.id] ? Object.keys(productAngles[product.id]) : [];
    
    // Build variations HTML
    let variationsHtml = '';
    if (colors.length > 0) {
        variationsHtml += `
            <div class="variation-label">🎨 Color:</div>
            <div class="variation-options" id="colorOptions">
                ${colors.map((color, i) => `<button class="variation-btn ${i === 0 ? 'active' : ''}" data-type="color" data-value="${color}">${color}</button>`).join('')}
            </div>
        `;
    }
    
    // Get recommendations
    let recommendationsHtml = '';
    try {
        const allProductsRes = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*&id=neq.${product.id}&limit=4`, {
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
        });
        let recommendations = await allProductsRes.json();
        if (recommendations && recommendations.length > 0) {
            recommendationsHtml = `
                <div class="recommendations-section">
                    <div class="recommendations-title">✨ You May Also Like</div>
                    <div class="recommendations-grid">
                        ${recommendations.map(rec => `
                            <a href="product-detail.html?id=${rec.id}" class="rec-product-card">
                                <img class="rec-product-img" src="${rec.image_url || defaultImages[rec.category] || 'https://picsum.photos/id/1/150/150'}" alt="${rec.name}">
                                <div class="rec-product-info">
                                    <div class="rec-product-name">${escapeHtml(rec.name)}</div>
                                    <div class="rec-product-price">RM ${(rec.price || 0).toFixed(2)}</div>
                                    <div class="rec-product-rating">⭐ ${rec.rating || 4.5}/5</div>
                                </div>
                            </a>
                        `).join('')}
                    </div>
                </div>
            `;
        }
    } catch(e) {}
    
    // Sample reviews
    const sampleReviews = [
        { name: "Ahmad F.", rating: 5, date: "2 days ago", text: "Excellent quality! Fast delivery and well packaged." },
        { name: "Siti N.", rating: 5, date: "5 days ago", text: "Very satisfied with my purchase. Product matches description perfectly." },
        { name: "Kevin T.", rating: 4, date: "1 week ago", text: "Good product for the price. Shipping was quick." }
    ];
    
    const reviewsHtml = sampleReviews.map(review => `
        <div class="review-card">
            <div class="reviewer-name">${review.name}</div>
            <div class="review-rating">${'⭐'.repeat(review.rating)} ${review.rating}/5</div>
            <div class="review-date">${review.date}</div>
            <div class="review-text">${review.text}</div>
        </div>
    `).join('');
    
    const html = `
        <div class="product-detail-main">
            <div class="product-detail-gallery">
                <div class="image-wrapper">
                    <img src="${imageUrl}" alt="${product.name}" id="mainProductImage">
                </div>
                ${hasAngles.length > 0 ? `
                <div class="angle-dots-container">
                    <div class="angle-dots">
                        ${hasAngles.map((angle, index) => `<button class="angle-dot ${index === 0 ? 'active' : ''}" data-angle="${angle}" title="${angle} view"></button>`).join('')}
                    </div>
                </div>
                ` : ''}
            </div>
            <div class="product-detail-info">
                <div class="product-detail-title">${escapeHtml(product.name)}</div>
                <div class="product-detail-brand">Brand: SeaTask Original</div>
                <div class="product-detail-rating">
                    <div class="rating-stars">${'⭐'.repeat(Math.floor(product.rating || 4.5))} ${product.rating || 4.5}/5</div>
                    <div class="rating-count">${product.review_count || 0} Ratings</div>
                </div>
                <div class="product-detail-price">
                    <span class="current-price">RM ${(product.price || 0).toFixed(2)}</span>
                    <span class="original-price">RM ${((product.price || 0) * 1.5).toFixed(2)}</span>
                    <span class="discount">-${Math.round((1 - (product.price || 0)/((product.price || 0)*1.5)) * 100)}%</span>
                </div>
                
                <div class="product-variations">
                    ${variationsHtml}
                </div>
                
                <div class="quantity-selector">
                    <button class="quantity-btn" id="decrQty">-</button>
                    <span class="quantity-value" id="qtyValue">1</span>
                    <button class="quantity-btn" id="incrQty">+</button>
                </div>
                
                <button class="add-to-cart-detail" id="addToCartBtn" data-id="${product.id}" data-name="${escapeHtml(product.name)}" data-price="${product.price}">Add to Cart</button>
                
                <div class="seller-info">
                    <div>🏪 <span class="seller-name">SeaTask Official Store</span></div>
                    <div>⭐ 98% Positive Ratings • Preferred Seller</div>
                </div>
                
                <div class="delivery-info">
                    <div class="delivery-row"><span>🚚 Delivery:</span><span>Kuala Lumpur</span></div>
                    <div class="delivery-row"><span>📅 Estimated Delivery:</span><span>${new Date(Date.now() + 3*24*60*60*1000).toLocaleDateString()} - ${new Date(Date.now() + 5*24*60*60*1000).toLocaleDateString()}</span></div>
                </div>
                
                <div class="warranty-info">
                    ✅ Authentic • 30 Days Free Return • 2 Year Warranty
                </div>
                
                <div class="details-description">
                    <strong>📝 Description:</strong><br>
                    ${product.description || 'No description available.'}
                </div>
            </div>
        </div>
        
        ${recommendationsHtml}
        
        <div class="reviews-section">
            <h3>Customer Reviews (${product.review_count || 0})</h3>
            ${reviewsHtml}
        </div>
    `;
    
    document.getElementById('detailContent').innerHTML = html;
    
    // Setup quantity selector
    let qty = 1;
    const qtySpan = document.getElementById('qtyValue');
    document.getElementById('incrQty')?.addEventListener('click', () => { qty++; if (qtySpan) qtySpan.innerText = qty; });
    document.getElementById('decrQty')?.addEventListener('click', () => { if (qty > 1) qty--; if (qtySpan) qtySpan.innerText = qty; });
    
    // Setup color buttons
    document.querySelectorAll('[data-type="color"]').forEach(btn => {
        btn.addEventListener('click', function() {
            const colorName = this.getAttribute('data-value');
            const newImageSrc = productColorImages[product.id]?.[colorName];
            const productImage = document.getElementById('mainProductImage');
            if (newImageSrc && productImage) {
                productImage.style.opacity = '0.5';
                setTimeout(() => {
                    productImage.src = newImageSrc;
                    productImage.style.opacity = '1';
                }, 150);
            }
            document.querySelectorAll('[data-type="color"]').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
        });
    });
    
    // Setup angle dots
    document.querySelectorAll('.angle-dot').forEach(dot => {
        dot.addEventListener('click', function() {
            const angleName = this.getAttribute('data-angle');
            const newImageSrc = productAngles[product.id]?.[angleName];
            const productImage = document.getElementById('mainProductImage');
            if (newImageSrc && productImage) {
                productImage.style.opacity = '0.5';
                setTimeout(() => {
                    productImage.src = newImageSrc;
                    productImage.style.opacity = '1';
                }, 150);
            }
            document.querySelectorAll('.angle-dot').forEach(d => d.classList.remove('active'));
            this.classList.add('active');
        });
    });
    
    // Add to cart
    const addBtn = document.getElementById('addToCartBtn');
    if (addBtn) {
        addBtn.addEventListener('click', () => {
            const id = parseInt(addBtn.dataset.id);
            const name = addBtn.dataset.name;
            const price = parseFloat(addBtn.dataset.price);
            
            let cart = JSON.parse(localStorage.getItem('my_simple_cart') || '[]');
            const existing = cart.find(item => item.id === id);
            
            if (existing) {
                existing.quantity += qty;
            } else {
                cart.push({ id: id, name: name, price: price, quantity: qty, addedAt: Date.now() });
            }
            
            localStorage.setItem('my_simple_cart', JSON.stringify(cart));
            
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const cartCount = document.getElementById('cartCount');
            if (cartCount) cartCount.innerText = totalItems;
            
            const toast = document.getElementById('toast');
            if (toast) {
                toast.innerText = `${name} added to cart! 🛒`;
                toast.style.opacity = '1';
                toast.style.visibility = 'visible';
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.visibility = 'hidden';
                }, 2000);
            }
        });
    }
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Update cart count
function updateCartCount() {
    const cart = JSON.parse(localStorage.getItem('my_simple_cart') || '[]');
    const total = cart.reduce((sum, item) => sum + item.quantity, 0);
    const cartCountSpan = document.getElementById('cartCount');
    if (cartCountSpan) cartCountSpan.innerText = total;
}

// Initialize
updateCartCount();
loadProductFromSupabase();

// Cart icon click
document.getElementById('cartIcon')?.addEventListener('click', () => {
    const cart = JSON.parse(localStorage.getItem('my_simple_cart') || '[]');
    const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
    alert(`Cart: ${cart.length} items\nTotal: RM ${total.toFixed(2)}`);
});
</script>
