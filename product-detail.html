<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SeaTask | Product Details</title>
<link rel="stylesheet" href="style.css">
<style>
/* ... (keep all your existing CSS styles from your previous working version) ... */
/* Make sure styles for .angle-dots-container, .color-selector, .recommendations-section are included */
</style>
</head>
<body>

<header>
<div class="logo">
<h1><span class="wave-emoji">🌊</span> SeaTask Marketplace</h1>
<p class="tagline">"When you feel good inside, the world mirrors it."</p>
</div>
<div class="header-icons">
<div class="cart-icon" id="cartIcon">
🛒 <span id="cartCount">0</span>
</div>
<div class="user-icon">👤</div>
</div>
</header>

<div class="product-detail-page" id="productDetailPage">
<a href="index.html" class="back-button">← Back to Marketplace</a>
<div id="detailContent">Loading product from database...</div>
</div>

<div id="toast" class="toast"></div>

<footer>
<div class="footer-content">
<div class="footer-section">
<h4>SeaTask Marketplace</h4>
<p>Let gratitude be your daily habit.</p>
</div>
</div>
<p class="copyright">&copy; 2025 SeaTask Marketplace — All rights reserved.</p>
</footer>

<!-- Load external scripts FIRST -->
<script src="product-angles.js"></script>
<script src="product-colors.js"></script>
<script src="universal-chatbot.js"></script>

<script>
// Supabase Configuration
const SUPABASE_URL = 'https://fladlejtkgjzpehvzkub.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZsYWRsZWp0a2dqenBlaHZ6a3ViIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwODEwMTcsImV4cCI6MjA5MzY1NzAxN30.uzMR3lWl0GrKKIcpWZRDZ9ac1y_gdjOocAUweSSZMgI';

// Default images by category
const defaultImages = {
    'Shirt': 'https://img.freepik.com/premium-photo/blue-cotton-tshirt-with-luxury-design-tshirt-mockup_677428-1057.jpg',
    'Hat': 'https://tse1.mm.bing.net/th/id/OIP.ti9ujzBZ9gwzAkfr34i6mgAAAA',
    'Accessories': 'https://images.pexels.com/photos/380774/pexels-photo-380774.jpeg',
    'Electronics': 'https://images.pexels.com/photos/12789436/pexels-photo-12789436.jpeg',
    'Badminton': 'https://cdn.store-assets.com/s/964873/i/49661033.jpg'
};

// Load product from Supabase
async function loadProductFromSupabase() {
    const urlParams = new URLSearchParams(window.location.search);
    const productId = parseInt(urlParams.get('id'));
    
    if (isNaN(productId)) {
        document.getElementById('detailContent').innerHTML = '<p>Invalid product ID.</p>';
        return;
    }
    
    try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/products?id=eq.${productId}&select=*`, {
            headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': `Bearer ${SUPABASE_ANON_KEY}`
            }
        });
        
        const products = await response.json();
        const product = products[0];
        
        if (!product) {
            document.getElementById('detailContent').innerHTML = `
                <div style="text-align:center; padding:40px;">
                    <h2>Product not found</h2>
                    <p>Product with ID ${productId} does not exist in the database.</p>
                    <a href="index.html" style="color: #1976a5;">← Back to Marketplace</a>
                </div>
            `;
            return;
        }
        
        // Display product with all features
        await displayProductDetail(product);
        
        // After displaying, initialize the interactive features
        // These functions come from the loaded external scripts
        if (typeof window.addAngleDots === 'function') {
            setTimeout(() => window.addAngleDots(), 100);
        }
        if (typeof window.initProductColors === 'function') {
            setTimeout(() => window.initProductColors(), 150);
        } else if (typeof window.initDetailPageColors === 'function') {
            setTimeout(() => window.initDetailPageColors(), 150);
        }
        
    } catch (error) {
        console.error('Error loading product:', error);
        document.getElementById('detailContent').innerHTML = `
            <div style="text-align:center; padding:40px;">
                <h2>Error loading product</h2>
                <p>${error.message}</p>
                <a href="index.html" style="color: #1976a5;">← Back to Marketplace</a>
            </div>
        `;
    }
}

async function displayProductDetail(product) {
    // Get image URL
    const imageUrl = product.image_url && product.image_url.startsWith('http') 
        ? product.image_url 
        : defaultImages[product.category] || 'https://picsum.photos/id/1/400/400';
    
    // Fetch recommendations (other products from same category)
    let recommendationsHtml = '';
    try {
        const allProductsRes = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*&category=eq.${product.category}&id=neq.${product.id}&limit=4`, {
            headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
        });
        let recommendations = await allProductsRes.json();
        if (!recommendations || recommendations.length === 0) {
            const otherRes = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*&id=neq.${product.id}&limit=4`, {
                headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` }
            });
            recommendations = await otherRes.json();
        }
        
        if (recommendations && recommendations.length > 0) {
            recommendationsHtml = `
                <div class="recommendations-section">
                    <div class="recommendations-title">✨ You May Also Like</div>
                    <div class="recommendations-grid">
                        ${recommendations.map(rec => `
                            <a href="product-detail.html?id=${rec.id}" class="rec-product-card">
                                <img class="rec-product-img" src="${rec.image_url || defaultImages[rec.category] || 'https://picsum.photos/id/1/150/150'}" alt="${rec.name}">
                                <div class="rec-product-info">
                                    <div class="rec-product-name">${escapeHtml(rec.name)}</div>
                                    <div class="rec-product-price">RM ${(rec.price || 0).toFixed(2)}</div>
                                    <div class="rec-product-rating">⭐ ${rec.rating || 4.5}/5</div>
                                </div>
                            </a>
                        `).join('')}
                    </div>
                </div>
            `;
        }
    } catch(e) {
        console.warn('Could not load recommendations', e);
    }
    
    // Build the main product detail HTML
    // Note: The variations container (color, size) will be populated by product-colors.js
    const html = `
        <div class="product-detail-main">
            <div class="product-detail-gallery">
                <div class="image-wrapper">
                    <img src="${imageUrl}" alt="${product.name}" id="mainProductImage">
                </div>
            </div>
            <div class="product-detail-info">
                <div class="product-detail-title">${escapeHtml(product.name)}</div>
                <div class="product-detail-brand">Brand: SeaTask Original</div>
                <div class="product-detail-rating">
                    <div class="rating-stars">${'⭐'.repeat(Math.floor(product.rating || 4.5))} ${product.rating || 4.5}/5</div>
                    <div class="rating-count">${product.review_count || 0} Ratings</div>
                </div>
                <div class="product-detail-price">
                    <span class="current-price">RM ${(product.price || 0).toFixed(2)}</span>
                    <span class="original-price">RM ${((product.price || 0) * 1.5).toFixed(2)}</span>
                    <span class="discount">-${Math.round((1 - (product.price || 0)/((product.price || 0)*1.5)) * 100)}%</span>
                </div>
                
                <!-- Variations container - will be populated by product-colors.js -->
                <div class="product-variations" id="productVariations"></div>
                
                <div class="quantity-selector">
                    <button class="quantity-btn" id="decrQty">-</button>
                    <span class="quantity-value" id="qtyValue">1</span>
                    <button class="quantity-btn" id="incrQty">+</button>
                </div>
                
                <button class="add-to-cart-detail" id="addToCartBtn" data-id="${product.id}" data-name="${escapeHtml(product.name)}" data-price="${product.price}">Add to Cart</button>
                
                <div class="seller-info">
                    <div>🏪 <span class="seller-name">SeaTask Official Store</span></div>
                    <div>⭐ 98% Positive Ratings • Preferred Seller</div>
                </div>
                
                <div class="delivery-info">
                    <div class="delivery-row"><span>🚚 Delivery:</span><span>Kuala Lumpur</span></div>
                    <div class="delivery-row"><span>📅 Estimated Delivery:</span><span>${new Date(Date.now() + 3*24*60*60*1000).toLocaleDateString()} - ${new Date(Date.now() + 5*24*60*60*1000).toLocaleDateString()}</span></div>
                </div>
                
                <div class="warranty-info">
                    ✅ Authentic • 30 Days Free Return • 2 Year Warranty
                </div>
                
                <div class="details-description">
                    <strong>📝 Description:</strong><br>
                    ${product.description || 'No description available.'}
                </div>
            </div>
        </div>
        
        ${recommendationsHtml}
    `;
    
    document.getElementById('detailContent').innerHTML = html;
    
    // Quantity selector
    let qty = 1;
    const qtySpan = document.getElementById('qtyValue');
    document.getElementById('incrQty')?.addEventListener('click', () => { qty++; if (qtySpan) qtySpan.innerText = qty; });
    document.getElementById('decrQty')?.addEventListener('click', () => { if (qty > 1) qty--; if (qtySpan) qtySpan.innerText = qty; });
    
    // Add to cart
    const addBtn = document.getElementById('addToCartBtn');
    if (addBtn) {
        addBtn.addEventListener('click', () => {
            const id = parseInt(addBtn.dataset.id);
            const name = addBtn.dataset.name;
            const price = parseFloat(addBtn.dataset.price);
            
            let cart = JSON.parse(localStorage.getItem('my_simple_cart') || '[]');
            const existing = cart.find(item => item.id === id);
            
            if (existing) {
                existing.quantity += qty;
            } else {
                cart.push({ id: id, name: name, price: price, quantity: qty, addedAt: Date.now() });
            }
            
            localStorage.setItem('my_simple_cart', JSON.stringify(cart));
            
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            const cartCount = document.getElementById('cartCount');
            if (cartCount) cartCount.innerText = totalItems;
            
            const toast = document.getElementById('toast');
            if (toast) {
                toast.innerText = `${name} added to cart! 🛒`;
                toast.style.opacity = '1';
                toast.style.visibility = 'visible';
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.visibility = 'hidden';
                }, 2000);
            }
        });
    }
}

function escapeHtml(text) {
    if (!text) return '';
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

// Initialize
loadProductFromSupabase();
</script>

<!-- Cart System -->
<script>
(function() {
    const CART_KEY = 'my_simple_cart';
    function updateCartCount() {
        const cart = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
        const total = cart.reduce((sum, item) => sum + item.quantity, 0);
        const cartCountSpan = document.getElementById('cartCount');
        if (cartCountSpan) cartCountSpan.innerText = total;
    }
    updateCartCount();
    
    const cartIcon = document.getElementById('cartIcon');
    if (cartIcon) {
        cartIcon.addEventListener('click', () => {
            const cart = JSON.parse(localStorage.getItem(CART_KEY) || '[]');
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            alert(`Cart: ${cart.length} items\nTotal: RM ${total.toFixed(2)}`);
        });
    }
})();
</script>

</body>
</html>
