{ id: 11, name: "Badminton Training Bag", category: "Badminton", price: 69.00, rating: 4.7, reviewCount: 234, image: "https://badminton-shop.fr/wp-content/uploads/2025/09/Hundred-Trailblazer-Bag-White-Badmintontaske.jpg", brand: "SeaTask Sports", origin: "Made in Vietnam", material: "Polyester + Mesh", description: "Professional badminton bag for 2 rackets and accessories.", care: "Spot clean with mild detergent." },
{ id: 12, name: "Professional Badminton Net", category: "Badminton", price: 89.00, rating: 4.8, reviewCount: 167, image: "https://myoutdoorsports.co.uk/wp-content/uploads/2022/04/buy-badminton-net-online.jpg", brand: "SeaTask Sports", origin: "Made in Malaysia", material: "Polyethylene + Steel Cable", description: "Regulation-size badminton net with steel cable.", care: "Store dry. Clean with soft brush." }
];

// ========== SAME CART SYSTEM AS MAIN PAGE ==========
(function() {
    console.log('🛒 DETAIL PAGE CART SYSTEM LOADING...');
    
    const CART_KEY = 'my_simple_cart';
    let cart = [];
    
    function loadCart() {
        const saved = localStorage.getItem(CART_KEY);
        if (saved) {
            cart = JSON.parse(saved);
        }
        updateCartDisplay();
    }
    
    function saveCart() {
        localStorage.setItem(CART_KEY, JSON.stringify(cart));
        updateCartDisplay();
    }
    
    function updateCartDisplay() {
        const total = cart.reduce((sum, item) => sum + (item.quantity || 1), 0);
        const countElement = document.getElementById('cartCount');
        if (countElement) countElement.innerText = total;
    }
    
    // THIS IS THE KEY FUNCTION - Add to cart using the same storage
    window.addToCart = function(productId, quantity = 1, variation = null) {
        const product = products.find(p => p.id === productId);
        if (!product) {
            console.error('Product not found:', productId);
            return;
        }
        
        console.log('Adding to cart:', product.name);
        
        const existing = cart.find(item => item.id === productId);
        if (existing) {
            existing.quantity += quantity;
        } else {
            cart.push({
                id: product.id,
                name: product.name,
                price: product.price,
                quantity: quantity
            });
        }
        
        saveCart();
        
        const toast = document.getElementById('toast');
        if (toast) {
            toast.innerText = `${product.name} added to cart! 🛒`;
            toast.style.opacity = '1';
            toast.style.visibility = 'visible';
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.visibility = 'hidden';
            }, 2000);
        }
        
        return cart;
    };
    
    // Also expose as addToMyCart for consistency
    window.addToMyCart = window.addToCart;
    
    // Show cart modal (same as main page)
    window.showCart = function() {
        const cartItemsDiv = document.getElementById('cartItems');
        const cartTotalSpan = document.getElementById('cartTotal');
        const cartModal = document.getElementById('cartModal');
        
        if (!cartItemsDiv) return;
        
        if (cart.length === 0) {
            cartItemsDiv.innerHTML = '<p style="text-align:center; padding:20px;">Your cart is empty. 🛒</p>';
            if (cartTotalSpan) cartTotalSpan.innerText = '0.00';
        } else {
            let html = '';
            let total = 0;
            
            cart.forEach((item, idx) => {
                total += item.price * item.quantity;
                html += `
                    <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #e0eef5;">
                        <div style="flex:1;">
                            <div style="font-weight: 500;">${escapeHtml(item.name)}</div>
                            <div style="font-size: 13px; color: #1976a5;">RM ${item.price.toFixed(2)} each</div>
                        </div>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <button class="cart-qty-btn" data-idx="${idx}" data-action="decr" style="background:#e0eef5; border:none; width:28px; height:28px; border-radius:50%; cursor:pointer;">-</button>
                            <span>${item.quantity}</span>
                            <button class="cart-qty-btn" data-idx="${idx}" data-action="incr" style="background:#e0eef5; border:none; width:28px; height:28px; border-radius:50%; cursor:pointer;">+</button>
                            <button class="cart-qty-btn" data-idx="${idx}" data-action="remove" style="background:#ff6b6b; border:none; width:28px; height:28px; border-radius:50%; cursor:pointer; color:white;">🗑</button>
                        </div>
                    </div>
                `;
            });
            
            cartItemsDiv.innerHTML = html;
            if (cartTotalSpan) cartTotalSpan.innerText = total.toFixed(2);
            
            document.querySelectorAll('.cart-qty-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const idx = parseInt(btn.dataset.idx);
                    const action = btn.dataset.action;
                    
                    if (action === 'incr') {
                        cart[idx].quantity++;
                    } else if (action === 'decr') {
                        if (cart[idx].quantity > 1) {
                            cart[idx].quantity--;
                        } else {
                            cart.splice(idx, 1);
                        }
                    } else if (action === 'remove') {
                        cart.splice(idx, 1);
                    }
                    saveCart();
                    window.showCart();
                });
            });
        }
        
        if (cartModal) cartModal.style.display = 'flex';
    };
    
    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }
    
    // Hook cart icon
    const cartIcon = document.getElementById('cartIcon');
    if (cartIcon) {
        const newIcon = cartIcon.cloneNode(true);
        cartIcon.parentNode.replaceChild(newIcon, cartIcon);
        newIcon.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            window.showCart();
        });
    }
    
    // Hook view cart button (if exists on detail page)
    const viewCartBtn = document.getElementById('viewCartBtn');
    if (viewCartBtn) {
        const newBtn = viewCartBtn.cloneNode(true);
        viewCartBtn.parentNode.replaceChild(newBtn, viewCartBtn);
        newBtn.addEventListener('click', (e) => {
            e.preventDefault();
            window.showCart();
        });
    }
    
    // Hook checkout button
    const checkoutBtn = document.getElementById('checkoutBtn');
    if (checkoutBtn) {
        const newBtn = checkoutBtn.cloneNode(true);
        checkoutBtn.parentNode.replaceChild(newBtn, checkoutBtn);
        newBtn.addEventListener('click', () => {
            if (cart.length === 0) {
                alert('Cart is empty! Add items first.');
                return;
            }
            document.getElementById('cartModal').style.display = 'none';
            document.getElementById('checkoutModal').style.display = 'flex';
        });
    }
    
    // Hook checkout form
    const checkoutForm = document.getElementById('checkoutForm');
    if (checkoutForm) {
        const newForm = checkoutForm.cloneNode(true);
        checkoutForm.parentNode.replaceChild(newForm, checkoutForm);
        newForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (cart.length === 0) {
                alert('Cart is empty!');
                return;
            }
            const total = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            cart = [];
            saveCart();
            alert(`✅ Order placed successfully!\nTotal: RM ${total.toFixed(2)}\nThank you for shopping!`);
            document.getElementById('checkoutModal').style.display = 'none';
            newForm.reset();
            window.showCart();
        });
    }
    
    // Close modal buttons
    const closeBtn = document.querySelector('#cartModal .close');
    if (closeBtn) {
        closeBtn.addEventListener('click', () => {
            document.getElementById('cartModal').style.display = 'none';
        });
    }
    
    const closeCheckout = document.querySelector('#checkoutModal .close-checkout');
    if (closeCheckout) {
        closeCheckout.addEventListener('click', () => {
            document.getElementById('checkoutModal').style.display = 'none';
        });
    }
    
    const continueBtn = document.getElementById('continueShoppingBtn');
    if (continueBtn) {
        continueBtn.addEventListener('click', () => {
            document.getElementById('cartModal').style.display = 'none';
        });
    }
    
    loadCart();
    console.log('✅ DETAIL PAGE CART SYSTEM READY!');
})();

// ========== PRODUCT DETAIL LOADER ==========
function getRecommendations(currentProduct) {
    let sameCategory = products.filter(p => p.category === currentProduct.category && p.id !== currentProduct.id);
    if (sameCategory.length < 4) {
        const priceRange = products.filter(p => p.id !== currentProduct.id && p.category !== currentProduct.category && Math.abs(p.price - currentProduct.price) < 50);
        sameCategory = [...sameCategory, ...priceRange];
    }
    return sameCategory.slice(0, 4);
}

function renderRecommendations(currentProduct) {
    const recommendations = getRecommendations(currentProduct);
    if (recommendations.length === 0) return '';
    return `
        <div class="recommendations-section">
            <div class="recommendations-title">✨ You May Also Like</div>
            <div class="recommendations-grid">
                ${recommendations.map(rec => `
                    <a href="product-detail.html?id=${rec.id}" class="rec-product-card">
                        <img class="rec-product-img" src="${rec.image}" alt="${rec.name}">
                        <div class="rec-product-info">
                            <div class="rec-product-name">${rec.name}</div>
                            <div class="rec-product-price">RM ${rec.price.toFixed(2)}</div>
                            <div class="rec-product-rating">⭐ ${rec.rating}/5</div>
                        </div>
                    </a>
                `).join('')}
            </div>
        </div>
    `;
}

function loadProductDetail() {
    const urlParams = new URLSearchParams(window.location.search);
    const productId = parseInt(urlParams.get('id'));
    const product = products.find(p => p.id === productId);
    
    if (!product) {
        document.getElementById('detailContent').innerHTML = '<p>Product not found.</p>';
        return;
    }
    
    let variationsHtml = '';
    if (product.colors && product.colors.length > 0) {
        variationsHtml += `
            <div class="variation-label">🎨 Color:</div>
            <div class="variation-options" id="colorOptions">
                ${product.colors.map((color, i) => `<button class="variation-btn ${i === 0 ? 'active' : ''}" data-type="color" data-value="${color}">${color}</button>`).join('')}
            </div>
        `;
    }
    if (product.sizes && product.sizes.length > 0) {
        variationsHtml += `
            <div class="variation-label" style="margin-top:15px;">📏 Size:</div>
            <div class="variation-options" id="sizeOptions">
                ${product.sizes.map((size, i) => `<button class="variation-btn ${i === 0 ? 'active' : ''}" data-type="size" data-value="${size}">${size}</button>`).join('')}
            </div>
        `;
    }
    
    const sampleReviews = [
        { name: "Ahmad F.", rating: 5, date: "2 days ago", text: "Excellent quality! Fast delivery and well packaged." },
        { name: "Siti N.", rating: 5, date: "5 days ago", text: "Very satisfied with my purchase." },
        { name: "Kevin T.", rating: 4, date: "1 week ago", text: "Good product for the price." }
    ];
    
    const reviewsHtml = sampleReviews.map(review => `
        <div class="review-card">
            <div class="reviewer-name">${review.name}</div>
            <div class="review-rating">${'⭐'.repeat(review.rating)} ${review.rating}/5</div>
            <div class="review-date">${review.date}</div>
            <div class="review-text">${review.text}</div>
        </div>
    `).join('');
    
    const recommendationsHtml = renderRecommendations(product);
    
    const html = `
        <div class="product-detail-main">
            <div class="product-detail-gallery">
                <div class="image-wrapper">
                    <img src="${product.image}" alt="${product.name}" id="mainProductImage">
                </div>
            </div>
            <div class="product-detail-info">
                <div class="product-detail-title">${product.name}</div>
                <div class="product-detail-brand">Brand: ${product.brand || 'SeaTask Original'}</div>
                <div class="product-detail-rating">
                    <div class="rating-stars">${'⭐'.repeat(Math.floor(product.rating))} ${product.rating}/5</div>
                    <div class="rating-count">${product.reviewCount || 0} Ratings</div>
                </div>
                <div class="product-detail-price">
                    <span class="current-price">RM ${product.price.toFixed(2)}</span>
                    <span class="original-price">RM ${(product.price * 1.5).toFixed(2)}</span>
                    <span class="discount">-${Math.round((1 - product.price/(product.price*1.5)) * 100)}%</span>
                </div>
                
                <div class="product-variations">
                    ${variationsHtml}
                </div>
                
                <div class="quantity-selector">
                    <button class="quantity-btn" id="decrQty">-</button>
                    <span class="quantity-value" id="qtyValue">1</span>
                    <button class="quantity-btn" id="incrQty">+</button>
                </div>
                
                <button class="add-to-cart-detail" id="addToCartBtn">Add to Cart</button>
                
                <div class="seller-info">
                    <div>🏪 <span class="seller-name">SeaTask Official Store</span></div>
                    <div>⭐ 98% Positive Ratings • Preferred Seller</div>
                </div>
                
                <div class="delivery-info">
                    <div class="delivery-row"><span>🚚 Delivery:</span><span>Kuala Lumpur</span></div>
                    <div class="delivery-row"><span>📅 Estimated Delivery:</span><span>${new Date(Date.now() + 3*24*60*60*1000).toLocaleDateString()} - ${new Date(Date.now() + 5*24*60*60*1000).toLocaleDateString()}</span></div>
                </div>
                
                <div class="warranty-info">
                    ✅ Authentic • 30 Days Free Return • 2 Year Warranty
                </div>
                
                <div class="details-description">
                    <strong>📝 Description:</strong><br>
                    ${product.description}
                    <br><br>
                    <strong>🧵 Material:</strong> ${product.material || 'Premium Quality'}<br>
                    <strong>📍 Origin:</strong> ${product.origin || 'Made in Malaysia'}<br>
                    <strong>🧼 Care:</strong> ${product.care || 'Standard care instructions.'}
                </div>
            </div>
        </div>
        
        ${recommendationsHtml}
        
        <div class="reviews-section">
            <h3>Customer Reviews (${product.reviewCount || 0})</h3>
            ${reviewsHtml}
        </div>
    `;
    
    document.getElementById('detailContent').innerHTML = html;
    
    let qty = 1;
    document.getElementById('incrQty')?.addEventListener('click', () => { qty++; document.getElementById('qtyValue').innerText = qty; });
    document.getElementById('decrQty')?.addEventListener('click', () => { if (qty > 1) qty--; document.getElementById('qtyValue').innerText = qty; });
    
    // THIS IS THE FIX - Use window.addToCart (which now uses the same cart system)
    document.getElementById('addToCartBtn')?.addEventListener('click', () => {
        const selectedColor = document.querySelector('[data-type="color"].active')?.getAttribute('data-value') || null;
        const selectedSize = document.querySelector('[data-type="size"].active')?.getAttribute('data-value') || null;
        window.addToCart(product.id, qty, { color: selectedColor, size: selectedSize });
    });
    
    document.querySelectorAll('.variation-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const parent = this.parentElement;
            parent.querySelectorAll('.variation-btn').forEach(b => b.classList.remove('active'));
            this.classList.add('active');
        });
    });
    
    if (typeof addAngleDots === 'function') {
        setTimeout(() => addAngleDots(), 100);
    }
}

loadProductDetail();
</script>

</body>
</html>
